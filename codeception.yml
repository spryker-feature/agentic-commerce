namespace: SprykerFeatureTest
include:
    - tests/SprykerFeatureTest/Client/AgenticCommerce
    - tests/SprykerFeatureTest/Glue/AgenticCommerce
    - tests/SprykerFeatureTest/Glue/AgenticCommerce/StorefrontApi
    - tests/SprykerFeatureTest/Service/AgenticCommerce
    - tests/SprykerFeatureTest/Shared/AgenticCommerce
    - tests/SprykerFeatureTest/Yves/AgenticCommerce
    - tests/SprykerFeatureTest/Zed/AgenticCommerce

paths:
    tests: tests/
    log: tests/_output/
    data: tests/_data/
    support: tests/_support/
