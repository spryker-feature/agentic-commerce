namespace: SprykerFeatureTest\Glue\AgenticCommerce

paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output

coverage:
    enabled: true
    remote: false
    whitelist: { include: ['../../../../src/*'] }

# The principal shape tests build user identifiers with the real principal resolvers, which read the database,
# so every suite of the shared actor enables the database helpers.
# One suite per directory: StorefrontApi/ holds the end-to-end suite with its own codeception.yml,
# so no suite here may use `path: .`.
x-glue-suite: &glueSuite
    actor: AgenticCommerceGlueTester
    modules:
        enabled:
            - Asserts
            - \SprykerTest\Shared\Testify\Helper\Environment
            - \SprykerTest\Shared\Testify\Helper\LocatorHelper
            - \SprykerTest\Shared\Testify\Helper\DataCleanupHelper
            - \SprykerTest\Shared\Propel\Helper\TransactionHelper
            - \SprykerTest\Shared\Testify\Helper\ConfigHelper
            - \SprykerTest\Shared\Testify\Helper\DependencyHelper
            - \SprykerTest\Service\Container\Helper\ContainerHelper
            - \SprykerTest\Zed\Store\Helper\StoreDependencyHelper
            - \SprykerTest\Shared\Customer\Helper\CustomerDataHelper
            - \SprykerTest\Shared\Store\Helper\StoreDataHelper
            - \SprykerTest\Zed\Testify\Helper\Business\BusinessHelper
            - \SprykerTest\Zed\Company\Helper\CompanyHelper
            - \SprykerTest\Zed\CompanyBusinessUnit\Helper\CompanyBusinessUnitHelper
            - \SprykerTest\Zed\CompanyRole\Helper\CompanyRoleHelper
            - \SprykerTest\Zed\Permission\Helper\PermissionHelper
            - \SprykerTest\Shared\CompanyUser\Helper\CompanyUserHelper
            - \SprykerFeatureTest\Shared\AgenticCommerce\Helper\AgenticCommerceHelper
            - \SprykerTest\Client\Testify\Helper\ClientHelper
            - \SprykerFeatureTest\Client\AgenticCommerce\Helper\AgenticCommerceClientTokenHelper
            - \SprykerFeatureTest\Client\AgenticCommerce\Helper\AgenticCommerceAuthenticatedConsentHelper

suites:
    GlueApi:
        <<: *glueSuite
        path: Api
    GlueContext:
        <<: *glueSuite
        path: Context
    GlueEventSubscriber:
        <<: *glueSuite
        path: EventSubscriber
    GlueLogger:
        <<: *glueSuite
        path: Logger
    GluePlugin:
        <<: *glueSuite
        path: Plugin
    GlueSecurity:
        <<: *glueSuite
        path: Security
    GlueStore:
        <<: *glueSuite
        path: Store
