namespace: SprykerFeatureTest\Yves\AgenticCommerce

paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output

coverage:
    enabled: true
    remote: false
    whitelist: { include: ['../../../../src/*'] }

suites:
    Yves:
        path: .
        actor: AgenticCommerceYvesTester
        modules:
            enabled:
                - Asserts
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerFeatureTest\Yves\AgenticCommerce\Helper\AgenticCommerceYvesHelper
